name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r toolkit/requirements-pdf.txt
      - run: python -m unittest discover -s tests -v
      - run: python toolkit/lead_magnet.py --output-dir toolkit/build/ci-preview
